<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#131B2E"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="glow" x1="200" y1="100" x2="1080" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#43A047" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Glow Circles -->
  <circle cx="240" cy="320" r="220" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="1040" cy="200" r="200" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Card Container -->
  <rect x="80" y="80" width="1120" height="480" rx="32" fill="#131B2E" fill-opacity="0.75" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- App Logo Graphic -->
  <circle cx="220" cy="320" r="80" fill="#2E1065" stroke="#A78BFA" stroke-width="4"/>
  <!-- Sound Wave Icon inside Logo -->
  <path d="M180 320L195 290L210 350L225 270L240 340L255 300L270 320" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Text Title & Subtitle -->
  <text x="340" y="270" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="64" fill="#FFFFFF" letter-spacing="-1px">Myusiq</text>
  <text x="340" y="340" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="28" fill="#94A3B8">Modern Offline Android Music Player</text>

  <!-- Feature Pills -->
  <g transform="translate(340, 390)">
    <rect x="0" y="0" width="160" height="44" rx="22" fill="#2E1065" stroke="#A78BFA" stroke-width="1.5"/>
    <text x="80" y="27" font-family="system-ui, sans-serif" font-weight="700" font-size="15" fill="#A78BFA" text-anchor="middle">Material You</text>

    <rect x="180" y="0" width="180" height="44" rx="22" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="270" y="27" font-family="system-ui, sans-serif" font-weight="700" font-size="15" fill="#38BDF8" text-anchor="middle">10-Band Studio EQ</text>

    <rect x="380" y="0" width="190" height="44" rx="22" fill="#1B5E20" stroke="#43A047" stroke-width="1.5"/>
    <text x="475" y="27" font-family="system-ui, sans-serif" font-weight="700" font-size="15" fill="#43A047" text-anchor="middle">Tap-to-Sync Lyrics</text>

    <rect x="590" y="0" width="140" height="44" rx="22" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="660" y="27" font-family="system-ui, sans-serif" font-weight="700" font-size="15" fill="#F8FAFC" text-anchor="middle">100% Offline</text>
  </g>
</svg>
