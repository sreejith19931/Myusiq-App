<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=Syne:wght@800&amp;display=swap');
    .brand-title {
      font-family: 'Syne', system-ui, -apple-system, sans-serif;
      font-weight: 800;
    }
    .subtitle {
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      font-weight: 600;
    }
    .pill-text {
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      font-weight: 700;
    }
  </style>

  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="50%" stop-color="#134074"/>
      <stop offset="100%" stop-color="#1E3C72"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="100" y1="100" x2="1180" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A192F" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#172A45" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="200" y1="100" x2="1080" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8DA9C4" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#EEF1F6" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>

  <!-- Banner Background -->
  <rect width="1280" height="640" fill="url(#bannerBg)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="320" r="260" fill="url(#accentGlow)" filter="url(#blurFilter)"/>
  <circle cx="1020" cy="240" r="220" fill="url(#accentGlow)" filter="url(#blurFilter)"/>

  <!-- Main Card Container -->
  <rect x="80" y="80" width="1120" height="480" rx="32" fill="url(#cardBg)" stroke="rgba(141, 169, 196, 0.3)" stroke-width="2"/>

  <!-- App Logo (Exact original logo colors: #EEF1F6 bg, #5A6370 headphones, #0B2545 waveform, #134074 nodes) -->
  <g transform="translate(140, 232) scale(1.65)">
    <!-- Background -->
    <rect width="108" height="108" rx="28" fill="#EEF1F6" stroke="#8DA9C4" stroke-width="2"/>

    <!-- Headband Arc -->
    <path d="M 29 48 C 29 18 79 18 79 48" stroke="#5A6370" stroke-width="5" stroke-linecap="round"/>

    <!-- Left Earcup -->
    <path d="M 27 46 H 31 V 66 H 27 C 24.8 66 23 64.2 23 62 V 50 C 23 47.8 24.8 46 27 46 Z" fill="#5A6370"/>
    <rect x="30" y="49" width="1" height="14" fill="#3A3F47"/>

    <!-- Right Earcup -->
    <path d="M 77 46 H 81 C 83.2 46 85 47.8 85 50 V 62 C 85 64.2 83.2 66 81 66 H 77 V 46 Z" fill="#5A6370"/>
    <rect x="77" y="49" width="1" height="14" fill="#3A3F47"/>

    <!-- Audio Waveform -->
    <path d="M 32 56 C 36 56 37 42 42 42 C 47 42 47 70 52 70 C 57 70 57 36 63 36 C 69 36 72 56 76 56" stroke="#0B2545" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Frequency Nodes -->
    <circle cx="42" cy="36" r="2.5" fill="#134074"/>
    <circle cx="52" cy="76" r="2" fill="#134074"/>
    <circle cx="63" cy="30" r="3" fill="#134074"/>
  </g>

  <!-- Text Title & Subtitle (Using Syne and Space Grotesk app typography) -->
  <text x="370" y="270" class="brand-title" font-size="68" fill="#FFFFFF" letter-spacing="-1.5px">Myusiq</text>
  <text x="370" y="340" class="subtitle" font-size="28" fill="#8DA9C4" letter-spacing="-0.5px">Modern Offline Android Music Player</text>

  <!-- Feature Pills -->
  <g transform="translate(370, 390)">
    <rect x="0" y="0" width="160" height="44" rx="22" fill="#134074" stroke="#8DA9C4" stroke-width="1.5"/>
    <text x="80" y="27" class="pill-text" font-size="15" fill="#EEF1F6" text-anchor="middle">Material You</text>

    <rect x="180" y="0" width="180" height="44" rx="22" fill="#0B2545" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="270" y="27" class="pill-text" font-size="15" fill="#38BDF8" text-anchor="middle">10-Band Studio EQ</text>

    <rect x="380" y="0" width="190" height="44" rx="22" fill="#1E3C72" stroke="#8DA9C4" stroke-width="1.5"/>
    <text x="475" y="27" class="pill-text" font-size="15" fill="#EEF1F6" text-anchor="middle">Tap-to-Sync Lyrics</text>

    <rect x="590" y="0" width="140" height="44" rx="22" fill="#0A192F" stroke="#5A6370" stroke-width="1.5"/>
    <text x="660" y="27" class="pill-text" font-size="15" fill="#8DA9C4" text-anchor="middle">100% Offline</text>
  </g>
</svg>
