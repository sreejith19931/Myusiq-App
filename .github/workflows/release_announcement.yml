name: Release Announcement & Telegram Notification

on:
  release:
    types: [published]

jobs:
  announce:
    name: Announce Release to Telegram and GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Post Announcement to Telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          TITLE="${RELEASE_NAME:-$TAG_NAME}"
          NOTES="${RELEASE_BODY:-No changelog provided.}"

          # Escape HTML special characters for Telegram HTML mode
          TITLE_ESCAPED=$(echo "$TITLE" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          NOTES_ESCAPED=$(echo "$NOTES" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          MESSAGE="🚀 <b>New Update Released!</b>%0A%0A"
          MESSAGE+="<b>Version:</b> ${TAG_NAME}%0A"
          MESSAGE+="<b>Title:</b> ${TITLE_ESCAPED}%0A%0A"
          MESSAGE+="<b>Changelog:</b>%0A${NOTES_ESCAPED}%0A%0A"
          MESSAGE+="🔗 <a href='${RELEASE_URL}'>View Release & Download APK</a>"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=false" \
            -d "text=${MESSAGE}"
