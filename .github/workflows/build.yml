name: Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Decode Release Keystore
      if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.jks

    - name: Build Release APKs
      if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
      env:
        RELEASE_STORE_FILE: release.jks
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: ./gradlew assembleRelease --no-daemon

    - name: Build Debug APK
      if: !(github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v'))
      run: ./gradlew assembleDebug --no-daemon

    - name: Run unit tests
      run: ./gradlew test --no-daemon

    - name: Prepare APKs for Release
      if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION_NAME=${GITHUB_REF_NAME}
        mkdir -p release-output
        cp app/build/outputs/apk/release/app-release.apk release-output/Myusiq-${VERSION_NAME}.apk
        if [ -f wear/build/outputs/apk/release/wear-release.apk ]; then
          cp wear/build/outputs/apk/release/wear-release.apk release-output/Myusiq-Wear-${VERSION_NAME}.apk
        fi

    - name: Clean up Keystore
      if: always() && (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v'))
      run: rm -f release.jks

    - name: Upload APK
      if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: release-output/Myusiq-*.apk

  release:
    needs: build
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: release-artifacts

      - name: Sync README and Images to Public Repo
        env:
          API_TOKEN_GITHUB: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git clone https://x-access-token:${API_TOKEN_GITHUB}@github.com/sreejith19931/Myusiq-App.git public-repo
          cp README.md public-repo/
          cp CHANGELOG.md public-repo/
          mkdir -p public-repo/images
          cp images/* public-repo/images/
          cd public-repo
          git add .
          git commit -m "Update README, Changelog and Screenshots for ${GITHUB_REF_NAME}" || echo "No changes to commit"
          git push https://x-access-token:${API_TOKEN_GITHUB}@github.com/sreejith19931/Myusiq-App.git main

      - name: Sync to Website Repo
        env:
          API_TOKEN_GITHUB: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # Update index.html using the changelog parser
          python scripts/update_roadmap.py
          
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git clone https://x-access-token:${API_TOKEN_GITHUB}@github.com/rhythmmusicplayer/myusiq.github.io.git website-repo
          cp -r docs/* website-repo/
          cd website-repo
          git add .
          git commit -m "deploy: update website for release ${GITHUB_REF_NAME}" || echo "No changes to commit"
          git push https://x-access-token:${API_TOKEN_GITHUB}@github.com/rhythmmusicplayer/myusiq.github.io.git main

      - name: Create Release on Public Repo
        uses: softprops/action-gh-release@v2
        with:
          repository: sreejith19931/Myusiq-App
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          target_commitish: main
          files: |
            release-artifacts/*.apk
            README.md
            CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: true
