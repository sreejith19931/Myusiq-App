name: Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Run unit tests
      run: ./gradlew test --no-daemon

    - name: Upload APK
      if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: release-artifacts

      - name: Create Release on Public Repo
        uses: softprops/action-gh-release@v2
        with:
          repository: sreejith19931/Rhythm-App
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            release-artifacts/*.apk
            README.md
            CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Sync README and Images to Public Repo
        env:
          API_TOKEN_GITHUB: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git clone https://x-access-token:${API_TOKEN_GITHUB}@github.com/sreejith19931/Rhythm-App.git public-repo
          cp README.md public-repo/
          cp CHANGELOG.md public-repo/
          mkdir -p public-repo/images
          cp images/* public-repo/images/
          cd public-repo
          git add .
          git commit -m "Update README, Changelog and Screenshots for ${GITHUB_REF_NAME}" || echo "No changes to commit"
          git push origin main
